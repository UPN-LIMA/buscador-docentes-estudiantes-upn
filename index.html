<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validacion UPN</title><style>
:root{--y:#fdba30;--b:#000000;--w:#ffffff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Segoe UI,sans-serif;background:var(--w);color:var(--b)}body{min-height:100vh;display:flex;flex-direction:column}header{background:var(--b);color:var(--w);border-bottom:7px solid var(--y);padding:16px clamp(14px,4vw,55px) 25px}.top{max-width:1300px;margin:auto;display:flex;align-items:center;gap:12px}.logo{border:3px solid var(--y);border-radius:13px;padding:8px 13px;color:var(--y);font-size:27px;font-weight:1000}.brand{font-size:19px;font-weight:900}.hero{max-width:1150px;margin:20px auto 0;text-align:center}.hero h1{font-size:clamp(29px,4vw,48px);margin:7px 0 17px}.eyebrow{color:var(--y);font-size:11px;font-weight:900;letter-spacing:2px}.panel{background:var(--w);padding:12px;border:3px solid var(--y);border-radius:20px;display:grid;grid-template-columns:170px 170px 1fr auto auto;gap:9px;box-shadow:7px 7px 0 var(--y)}select,input,button{height:52px;border-radius:12px;font:700 14px Arial}select,input{border:2px solid var(--b);background:var(--w);color:var(--b);padding:0 14px;position:relative;z-index:2;pointer-events:auto;outline:none}select:focus,input:focus{box-shadow:0 0 0 4px var(--y)}button{border:2px solid var(--b);cursor:pointer;padding:0 20px;transition:.15s}button:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--b)}.search{background:var(--y);color:var(--b)}.clear,.back{background:var(--b);color:var(--w);border-color:var(--y)}main{width:min(1150px,94%);margin:20px auto;flex:1}.result{border:3px solid var(--b);border-radius:18px;overflow:hidden;background:var(--w);min-height:145px}.empty{display:grid;place-items:center;text-align:center;border-style:dashed}.head{background:var(--y);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:3px solid var(--b)}.head strong{font-size:25px}.badge{background:var(--b);color:var(--w);padding:8px 12px;border-radius:999px;font-weight:900}.person{padding:19px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{border-left:6px solid var(--y);padding:8px 12px}.label{font-size:10px;font-weight:900;letter-spacing:1px}.value{font-size:18px;font-weight:900;margin-top:3px}.list{padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-height:310px;overflow:auto}.choice{text-align:left;background:var(--w);color:var(--b);border:2px solid var(--b);padding:10px 13px;height:auto;min-height:60px}.choice small{font-weight:400}.actions{padding:0 18px 18px}.back{height:44px}.loading{opacity:.55;pointer-events:none}footer{text-align:center;border-top:3px solid var(--b);padding:12px;font-size:11px;font-weight:800}@media(max-width:800px){.panel{grid-template-columns:1fr 1fr}.panel input{grid-column:1/-1}.panel button{width:100%}}@media(max-width:560px){header{padding:12px 10px 20px}.brand{font-size:15px}.hero{margin-top:14px}.panel{grid-template-columns:1fr;box-shadow:5px 5px 0 var(--y)}.panel input{grid-column:auto}.person,.list{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.result{min-height:130px}}
</style></head><body><header><div class="top"><div class="logo">UPN</div><div class="brand">Universidad Privada del Norte</div></div><div class="hero"><div class="eyebrow">VALIDACION PARA RECEPCION</div><h1>Docentes y estudiantes</h1><div class="panel"><select id="type"><option value="teacher">Docente</option><option value="student">Estudiante</option></select><select id="campus"><option value="">Todos los campus</option></select><input id="q" autocomplete="off" placeholder="Nombre, apellido o codigo"><button id="go" class="search">Buscar</button><button id="clear" class="clear">Limpiar</button></div></div></header><main><section id="results" class="result empty">Ingresa un nombre, apellido o codigo.</section></main><footer>UPN · Herramienta de recepcion</footer><script>
const $=x=>document.querySelector(x),norm=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let teachers=[],students=[],last=[];
async function init(){[teachers,students]=await Promise.all([fetch('data/teachers.json').then(r=>r.json()),fetch('data/students_index.json').then(r=>r.json())]);let camps=[...new Set([...teachers.flatMap(x=>x.campus),...students.map(x=>x.campus)].filter(Boolean))].sort();camps.forEach(c=>$('#campus').insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`))}
function validate(p,type,campus){$('#results').className='result';$('#results').innerHTML=`<div class="head"><strong>Si pertenece a la universidad</strong><span class="badge">${esc(type)}</span></div><div class="person"><div class="field"><div class="label">NOMBRE</div><div class="value">${esc(p.nombre)}</div></div><div class="field"><div class="label">CODIGO</div><div class="value">${esc(p.codigo)}</div></div><div class="field"><div class="label">TIPO</div><div class="value">${esc(type)}</div></div><div class="field"><div class="label">CAMPUS</div><div class="value">${esc(campus||'No especificado')}</div></div></div><div class="actions"><button class="back" onclick="back()">Volver a resultados</button></div>`}
function showList(a,type){last=a;if(!a.length){$('#results').className='result empty';$('#results').textContent='No se encontro en la base institucional.';return}if(a.length===1){pick(0);return}$('#results').className='result';$('#results').innerHTML=`<div class="head"><strong>${a.length} coincidencias</strong><span class="badge">Selecciona una</span></div><div class="list">${a.map((p,i)=>`<button class="choice" onclick="pick(${i})"><b>${esc(p.nombre)}</b><br><small>${esc(p.codigo)} · ${esc(Array.isArray(p.campus)?p.campus.join(', '):p.campus)}</small></button>`).join('')}</div>`}
function pick(i){const p=last[i],type=$('#type').value==='teacher'?'Docente':'Estudiante';validate(p,type,Array.isArray(p.campus)?p.campus.join(', '):p.campus)}function back(){showList(last,$('#type').value)}
function run(){const type=$('#type').value,q=norm($('#q').value),camp=$('#campus').value;if(q.length<2){$('#results').className='result empty';$('#results').textContent='Escribe al menos 2 caracteres.';return}const base=type==='teacher'?teachers:students;let a=base.filter(p=>(norm(p.nombre).includes(q)||norm(p.codigo).includes(q))&&(!camp||(Array.isArray(p.campus)?p.campus.includes(camp):p.campus===camp))).slice(0,40);showList(a,type)}
function reset(){$('#q').value='';$('#campus').value='';last=[];$('#results').className='result empty';$('#results').textContent='Ingresa un nombre, apellido o codigo.';$('#q').focus()}$('#go').onclick=run;$('#clear').onclick=reset;$('#q').onkeydown=e=>{if(e.key==='Enter')run()};$('#type').onchange=reset;init().catch(()=>{$('#results').textContent='No se pudieron cargar los archivos de datos.'});
</script></body></html>
